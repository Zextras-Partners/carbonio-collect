
name: Auto Tag and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carbonio-collect-auto-release
  queue: max

jobs:
  release:
    name: Publish semantic release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate script syntax
        run: bash -n crb_collect.sh

      - name: Install release tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            semantic-release@25.0.9 \
            conventional-changelog-conventionalcommits@10.4.1

      - name: Skip outdated workflow runs
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags

          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'This run no longer targets the latest main commit.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.head.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
